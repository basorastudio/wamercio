services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      APP_URL: ${APP_URL}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL}
      UPLOAD_DIR: /app/data/uploads
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  whatsapp:
    build:
      context: ./services/whatsapp-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8090
      DATABASE_URL: ${WHATSAPP_DATABASE_URL}
      CORE_WEBHOOK_URL: ${CORE_WEBHOOK_URL}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      TZ: ${TZ:-America/Santo_Domingo}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      TZ: ${TZ:-America/Santo_Domingo}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.wamercio-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.wamercio-web-http.rule=Host(`wamercio.com`) || Host(`www.wamercio.com`)"
      - "traefik.http.routers.wamercio-web-http.entrypoints=web"
      - "traefik.http.routers.wamercio-web-http.service=wamercio-web"
      - "traefik.http.routers.wamercio-web-http.middlewares=wamercio-https-redirect"
      - "traefik.http.middlewares.wamercio-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.wamercio-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.wamercio-web.rule=Host(`wamercio.com`) || Host(`www.wamercio.com`)"
      - "traefik.http.routers.wamercio-web.entrypoints=websecure"
      - "traefik.http.routers.wamercio-web.service=wamercio-web"
      - "traefik.http.routers.wamercio-web.tls=true"
      - "traefik.http.routers.wamercio-web.tls.certResolver=letsencrypt"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  dokploy-network:
    external: true
