services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      PLATFORM_CONFIG_SECRET: ${PLATFORM_CONFIG_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      APP_URL: ${APP_URL}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-wamercio.com}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-ltd.do}
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-domains.ltd.do}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL}
      STT_API_URL: ${STT_API_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      WAMERCIO_SOCIAL_AUTH_PROXY_ENABLED: ${WAMERCIO_SOCIAL_AUTH_PROXY_ENABLED:-true}
      WAMERCIO_SOCIAL_AUTH_PROXY_BASE_URL: ${WAMERCIO_SOCIAL_AUTH_PROXY_BASE_URL:-https://auth-apps.bitapps.pro/apps}
      WAMERCIO_SOCIAL_AUTH_PROXY_REDIRECT_URI: ${WAMERCIO_SOCIAL_AUTH_PROXY_REDIRECT_URI:-https://auth-apps.bitapps.pro/redirect/v2}
      WAMERCIO_SOCIAL_PUBLISH_POLL_SECONDS: ${WAMERCIO_SOCIAL_PUBLISH_POLL_SECONDS:-30}
      WAMERCIO_SOCIAL_FACEBOOK_CLIENT_ID: ${WAMERCIO_SOCIAL_FACEBOOK_CLIENT_ID:-}
      WAMERCIO_SOCIAL_FACEBOOK_CLIENT_SECRET: ${WAMERCIO_SOCIAL_FACEBOOK_CLIENT_SECRET:-}
      WAMERCIO_SOCIAL_FACEBOOK_REDIRECT_URI: ${WAMERCIO_SOCIAL_FACEBOOK_REDIRECT_URI:-}
      WAMERCIO_SOCIAL_INSTAGRAM_CLIENT_ID: ${WAMERCIO_SOCIAL_INSTAGRAM_CLIENT_ID:-}
      WAMERCIO_SOCIAL_INSTAGRAM_CLIENT_SECRET: ${WAMERCIO_SOCIAL_INSTAGRAM_CLIENT_SECRET:-}
      WAMERCIO_SOCIAL_INSTAGRAM_REDIRECT_URI: ${WAMERCIO_SOCIAL_INSTAGRAM_REDIRECT_URI:-}
      WAMERCIO_SOCIAL_LINKEDIN_CLIENT_ID: ${WAMERCIO_SOCIAL_LINKEDIN_CLIENT_ID:-}
      WAMERCIO_SOCIAL_LINKEDIN_CLIENT_SECRET: ${WAMERCIO_SOCIAL_LINKEDIN_CLIENT_SECRET:-}
      WAMERCIO_SOCIAL_LINKEDIN_REDIRECT_URI: ${WAMERCIO_SOCIAL_LINKEDIN_REDIRECT_URI:-}
      WAMERCIO_SOCIAL_GOOGLE_BUSINESS_CLIENT_ID: ${WAMERCIO_SOCIAL_GOOGLE_BUSINESS_CLIENT_ID:-}
      WAMERCIO_SOCIAL_GOOGLE_BUSINESS_CLIENT_SECRET: ${WAMERCIO_SOCIAL_GOOGLE_BUSINESS_CLIENT_SECRET:-}
      WAMERCIO_SOCIAL_GOOGLE_BUSINESS_REDIRECT_URI: ${WAMERCIO_SOCIAL_GOOGLE_BUSINESS_REDIRECT_URI:-}
      UPLOAD_DIR: /app/data/uploads
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  whatsapp:
    build:
      context: ./services/whatsapp-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8090
      DATABASE_URL: ${WHATSAPP_DATABASE_URL}
      CORE_WEBHOOK_URL: ${CORE_WEBHOOK_URL}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      UPLOAD_DIR: /app/data/uploads
      WAMERCIO_WEBRTC_EXTERNAL_IP: ${WAMERCIO_WEBRTC_EXTERNAL_IP:-}
      WAMERCIO_WEBRTC_UDP_PORT_MIN: ${WAMERCIO_WEBRTC_UDP_PORT_MIN:-55000}
      WAMERCIO_WEBRTC_UDP_PORT_MAX: ${WAMERCIO_WEBRTC_UDP_PORT_MAX:-55100}
      WAMERCIO_CALLS_MAX_PER_STORE: ${WAMERCIO_CALLS_MAX_PER_STORE:-8}
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "8090"
    ports:
      - "${WAMERCIO_WEBRTC_UDP_PORT_MIN:-55000}-${WAMERCIO_WEBRTC_UDP_PORT_MAX:-55100}:${WAMERCIO_WEBRTC_UDP_PORT_MIN:-55000}-${WAMERCIO_WEBRTC_UDP_PORT_MAX:-55100}/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-wamercio.com}
        NEXT_PUBLIC_TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-ltd.do}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-wamercio.com}
      NEXT_PUBLIC_TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-ltd.do}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-America/Santo_Domingo}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Stable reverse-proxy endpoint between Dokploy Traefik and Next.js.
  # Traefik never points directly to the recreated Next.js container.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      default:
      dokploy-network:
        aliases:
          - wamercio-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  domain-router:
    build:
      context: ./services/domain-router
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-ltd.do}
      TRAEFIK_DYNAMIC_DIR: /target
      TZ: ${TZ:-America/Santo_Domingo}
    volumes:
      - /etc/dokploy/traefik/dynamic:/target
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy

  # Install the dynamic Traefik config only after the stable gateway is healthy.
  # This prevents a race during Compose recreations that can leave Traefik on 502.
  traefik-config:
    image: alpine:3.21
    restart: "no"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./infra/traefik/wamercio.yml:/source/wamercio.yml:ro
      - /etc/dokploy/traefik/dynamic:/target
    command:
      - /bin/sh
      - -c
      - >-
        cp /source/wamercio.yml /target/wamercio.yml.tmp &&
        chmod 0644 /target/wamercio.yml.tmp &&
        mv /target/wamercio.yml.tmp /target/wamercio.yml &&
        echo 'WAMERCIO Traefik dynamic configuration installed after gateway health check.'

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  dokploy-network:
    external: true
