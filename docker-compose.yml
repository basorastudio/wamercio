services:
  postgres:
    image: postgres:16-alpine
    container_name: wamercio_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colmapro_core}
      POSTGRES_USER: ${POSTGRES_USER:-colmapro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password}
      TZ: ${TZ:-America/Santo_Domingo}
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.auto.conf"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.auto.conf:/etc/postgresql/postgresql.auto.conf:ro
    shm_size: "512mb"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER:-colmapro} -d $${POSTGRES_DB:-colmapro_core} -h 127.0.0.1"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  pgbouncer:
    build:
      context: ./deploy/pgbouncer
    container_name: wamercio_pgbouncer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "6432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -h 127.0.0.1 -p 6432 -U $${POSTGRES_USER:-colmapro} >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: wamercio_redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
    command: >
      sh -c 'exec redis-server --appendonly yes --maxmemory "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "ping"
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-development}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    cpus: "${BACKEND_CPUS:-2.0}"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Santo_Domingo}
      TERRITORY_DATA_DIR: ${TERRITORY_DATA_DIR:-/app/data}
      GEO_RD_MAP_ENABLED: ${GEO_RD_MAP_ENABLED:-false}
      GEO_RD_MAP_URL: ${GEO_RD_MAP_URL:-https://geo.ltd.do}
      GEO_RD_MAP_API_KEY: ${GEO_RD_MAP_API_KEY:-}
      GEO_RD_MAP_TIMEOUT: ${GEO_RD_MAP_TIMEOUT:-12s}
      CATALOG_DATA_FILE: ${CATALOG_DATA_FILE:-/app/data/catalog.json}
      CENTRAL_DATABASE_URL: ${CENTRAL_DATABASE_URL:?CENTRAL_DATABASE_URL must be configured}
      GLOBAL_CUSTOMERS_DATABASE_URL: ${GLOBAL_CUSTOMERS_DATABASE_URL:?GLOBAL_CUSTOMERS_DATABASE_URL must be configured}
      TENANT_DATABASE_URL_TEMPLATE: ${TENANT_DATABASE_URL_TEMPLATE:?TENANT_DATABASE_URL_TEMPLATE must be configured}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      USE_PGBOUNCER: ${USE_PGBOUNCER:-true}
      PGBOUNCER_ADDR: ${PGBOUNCER_ADDR:-pgbouncer:6432}
      INTERNAL_ADDR: 127.0.0.1:6060
      GOMEMLIMIT: ${BACKEND_GOMEMLIMIT:-1380MiB}
      GOGC: ${BACKEND_GOGC:-100}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_ADMIN_USERNAME: ${NEXT_PUBLIC_ADMIN_USERNAME:-}
        NEXT_PUBLIC_PLATFORM_ADMIN_USERNAME: ${NEXT_PUBLIC_PLATFORM_ADMIN_USERNAME:-superadmin}
        NEXT_PUBLIC_PLATFORM_DOMAIN: ${APP_DOMAIN:-}
        NEXT_PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN:-}
        NEXT_PUBLIC_APP_TIMEZONE: ${NEXT_PUBLIC_APP_TIMEZONE:-America/Santo_Domingo}
        NEXT_PUBLIC_CATALOG_IMAGE_BASE_URL: ${NEXT_PUBLIC_CATALOG_IMAGE_BASE_URL:-https://catalogo.ltd.do}
    container_name: wamercio_frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # HTTP: cualquier subdominio directo de ltd.do
      - 'traefik.http.routers.wamercio-tenants-web.rule=HostRegexp(`^[a-z0-9-]+[.]ltd[.]do$`)'
      - "traefik.http.routers.wamercio-tenants-web.entrypoints=web"
      - "traefik.http.routers.wamercio-tenants-web.priority=100"
      - "traefik.http.routers.wamercio-tenants-web.service=wamercio-tenants"

      # HTTPS: Cloudflare en modo Completo/Full llega al origen por 443
      - 'traefik.http.routers.wamercio-tenants-websecure.rule=HostRegexp(`^[a-z0-9-]+[.]ltd[.]do$`)'
      - "traefik.http.routers.wamercio-tenants-websecure.entrypoints=websecure"
      - "traefik.http.routers.wamercio-tenants-websecure.tls=true"
      - "traefik.http.routers.wamercio-tenants-websecure.priority=100"
      - "traefik.http.routers.wamercio-tenants-websecure.service=wamercio-tenants"

      # Nginx del frontend escucha internamente en el puerto 80
      - "traefik.http.services.wamercio-tenants.loadbalancer.server.port=80"
      # Afinidad por navegador: evita mezclar HTML de una imagen con chunks
      # inmutables de otra imagen durante actualizaciones progresivas.
      - "traefik.http.services.wamercio-tenants.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.wamercio-tenants.loadbalancer.sticky.cookie.name=wamercio_frontend"
      - "traefik.http.services.wamercio-tenants.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.wamercio-tenants.loadbalancer.sticky.cookie.httponly=true"
      - "traefik.http.services.wamercio-tenants.loadbalancer.sticky.cookie.samesite=lax"

volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
