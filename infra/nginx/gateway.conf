# WAMERCIO stable gateway for Dokploy.
# Docker containers receive a new IP when they are recreated. Using Docker's
# embedded DNS resolver with a variable forces Nginx to re-resolve `web`
# instead of caching an obsolete container IP and returning 502 after deploys.
server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    set $wamercio_web "web:3000";

    # End-to-end health: gateway + current Next.js container.
    location = /gateway-health {
        access_log off;
        proxy_pass http://$wamercio_web/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }

    location / {
        proxy_pass http://$wamercio_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Retry transient errors while Docker finishes replacing the web container.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
