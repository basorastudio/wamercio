<!doctype html>
<html lang="es-DO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00a884">
  <title>WAMERCIO sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef3f7;color:#102033;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:30px;text-align:center;background:#fff;border:1px solid #dce5eb;border-radius:24px;box-shadow:0 24px 70px rgba(15,26,40,.15)}.icon{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;background:rgba(0,168,132,.12);display:flex;align-items:center;justify-content:center;color:#00a884;font-size:28px;font-weight:900}h1{margin:0;font-size:22px;line-height:1.2}p{margin:10px 0 0;color:#66768a;font-size:14px;line-height:1.6}button{margin-top:18px;border:0;border-radius:12px;background:#00a884;color:#fff;font-weight:800;padding:12px 18px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">C</div>
    <h1>Sin conexión a WAMERCIO</h1>
    <p>Comprueba tu conexión a Internet y vuelve a intentarlo. Tus datos guardados no se perderán.</p>
    <button type="button" onclick="location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
