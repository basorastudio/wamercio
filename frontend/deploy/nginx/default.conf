map $http_cf_visitor $wamercio_forwarded_proto {
  default $scheme;
  ~*"scheme":"https" https;
}

map $http_user_agent $wamercio_og_bot {
  default 0;
  ~*(facebookexternalhit|facebot|whatsapp|telegrambot|twitterbot|linkedinbot|slackbot|discordbot|pinterest|skypeuripreview|applebot) 1;
}

# Keep tenant manifests installable even while the backend and frontend are
# being rolled independently. If an older backend does not yet expose the
# dynamic icon endpoint, Nginx serves the bundled valid PNG of the requested
# size instead of returning a manifest-breaking 404.
map $arg_size $wamercio_pwa_icon_fallback {
  default /icons/icon-512.png;
  "192" /icons/icon-192.png;
}

# The bare tenant root domain is reserved exclusively for wildcard tenant names.
# Redirecting it avoids displaying a store without a real tenant.
map $host $wamercio_root_domain_redirect {
  default "";
  "ltd.do" "https://wamercio.com";
}

server {
  listen 80;
  server_name wamercio.com www.wamercio.com ltd.do *.ltd.do;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # Browser security policy for the business panel and public catalog.
  # OpenStreetMap frames are explicitly allowed because the delivery and store
  # location screens use its embedded map; no third-party script origin is allowed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://www.openstreetmap.org" always;

  # Compatible with Cloudflare Flexible SSL/TLS:
  # the origin listens on HTTP port 80 and does NOT redirect to HTTPS, avoiding redirect loops.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $backend_upstream backend:8080;

  # Safe use of Nginx if: this branch only returns an immediate redirect.
  # $request_uri preserves the path and query string. URL fragments are preserved by the browser.
  if ($wamercio_root_domain_redirect != "") {
    return 301 $wamercio_root_domain_redirect$request_uri;
  }

  # The dynamic endpoint is preferred so each tenant can use its own logo.
  # A 404 from a temporarily older backend falls back to the bundled icon,
  # which prevents Chrome from rejecting the PWA manifest.
  location = /api/pwa/icon.png {
    add_header Cache-Control "public, max-age=300" always;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wamercio_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @pwa_icon_fallback;
  }

  location @pwa_icon_fallback {
    internal;
    add_header Cache-Control "public, max-age=300" always;
    try_files $wamercio_pwa_icon_fallback =404;
  }

  # IMPORTANT:
  # When proxy_pass uses variables, do not append /api/ to the upstream URL,
  # because Nginx may forward an incorrect path to the backend and return 404.
  # This preserves the complete original URI: /api/bootstrap, /api/admin/login, etc.
  location /api/ {
    add_header Cache-Control "no-store" always;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wamercio_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # Provisioning can legitimately take up to ten minutes. Backend request
    # deadlines remain the authoritative per-route limit.
    proxy_read_timeout 650s;

    # Do not intercept HTTP errors returned intentionally by the Go API.
    # Identity providers can return 502/503/504 while WAMERCIO itself remains
    # healthy; preserving the backend JSON lets the UI show the real DGII/MIREX
    # error instead of incorrectly reporting that the WAMERCIO backend is down.
    # Transport failures generated by Nginx still reach the browser as gateway
    # errors and are translated by frontend/src/lib/api.ts.
    proxy_intercept_errors off;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location = /health {
    proxy_pass http://$backend_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wamercio_forwarded_proto;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri =404;
  }

  location = /runtime-recovery.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri =404;
  }

  location = /chunk-recovery.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri =404;
  }

  location = /offline.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri =404;
  }

  # During a rolling deployment an old HTML document can briefly request a
  # chunk that belongs to the previous image. Return a tiny recovery script for
  # missing JavaScript chunks so the browser clears obsolete PWA caches and
  # reloads the current document instead of remaining on a blank React error.
  location ~ ^/_next/static/.*[.]js$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    error_page 404 =200 /chunk-recovery.js;
    try_files $uri =404;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri =404;
  }

  # Professional Open Graph previews for WhatsApp, Facebook, Telegram and other applications.
  # Regular users receive the SPA; social crawlers receive dynamic HTML with og:* metadata
  # generated by the backend according to the business domain or subdomain.
  location = / {
    error_page 418 = @og_store;
    if ($wamercio_og_bot) { return 418; }
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  location @og_store {
    add_header Cache-Control "no-store" always;
    rewrite ^ /api/og/store break;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wamercio_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0" always;
    add_header Pragma "no-cache" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
