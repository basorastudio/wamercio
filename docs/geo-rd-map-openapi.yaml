        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: listTerritorialDivisions
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key privada de la aplicación. Las claves se crean en Integraciones API del panel administrativo. Cada
        clave puede limitarse por scopes, orígenes permitidos y rate limit.
  parameters:
    TenantID:
      in: header
      name: X-Tenant-ID
      required: false
      schema:
        type: string
        maxLength: 128
      description: Identificador opcional del tenant que origina una sugerencia de barrio personalizado.
    ProvinceCode:
      in: query
      name: provinceCode
      required: false
      schema:
        type: string
        pattern: ^[0-9]{2}$
        example: '25'
      description: Código provincial de dos dígitos.
    CityID:
      in: query
      name: cityId
      required: false
      schema:
        type: string
        example: '25:01:01'
      description: Identificador GEO RD MAP de ciudad (municipio o distrito municipal).
    Latitude:
      in: query
      name: lat
      required: true
      schema:
        type: number
        format: double
        minimum: 17.0
        maximum: 20.5
        example: 18.4861
    Longitude:
      in: query
      name: lng
      required: true
      schema:
        type: number
        format: double
        minimum: -72.5
        maximum: -68.0
        example: -69.9312
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: API key ausente, inválida o inactiva.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: La API key no posee el scope requerido o el origen no está autorizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto o duplicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Límite global o por API key excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Una dependencia o proveedor requerido no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - valid
      - message
      properties:
        valid:
          type: boolean
          example: false
        message:
          type: string
          example: API Key inválida o inactiva
    GenericSuccessResponse:
      type: object
      required:
      - valid
      - data
      properties:
        valid:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        message:
          type: string
    GenericArrayResponse:
      type: object
      required:
      - valid
      - data
      properties:
        valid:
          type: boolean
          example: true
        data:
          type: array
          items: {}
        message:
          type: string
    Region:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          example: CIBAO_NORTE
        name:
          type: string
          example: Cibao Norte
    Province:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          pattern: ^[0-9]{2}$
          example: '25'
        name:
          type: string
          example: Santiago
        identifier:
          type: string
        regionCode:
          type: string
    City:
      type: object
