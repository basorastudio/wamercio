openapi: 3.0.3
info:
  title: GEO RD MAP API
  version: 2.6.1
  description: API geoespacial central de República Dominicana para integrar división territorial, selectores Provincia →
    Ciudad → Barrio, geocodificación, autocomplete, reverse geocoding, lugares y direcciones, GeoJSON/MVT, geocercas, routing
    y navegación. Las integraciones externas usan una API key privada por aplicación, permisos por scope, restricciones de
    origen y límites de consumo. Esta especificación documenta únicamente la API pública de integración; los endpoints /api/v1/admin
    forman parte del panel operativo y no son una API de consumo.
  contact:
    name: Administración de GEO RD MAP
servers:
- url: https://geo.ltd.do
  description: Producción
- url: http://localhost:8080
  description: Backend local
security:
- ApiKeyAuth: []
paths:
  /healthz:
    get:
      tags:
      - Sistema
      security: []
      summary: Comprobar liveness del proceso
      description: Verifica que el proceso HTTP de GEO RD MAP está respondiendo.
      operationId: getHealth
      responses:
        '200':
          description: Proceso operativo
          content:
            text/plain:
              schema:
                type: string
                example: 'ok

                  '
  /readyz:
    get:
      tags:
      - Sistema
      security: []
      summary: Comprobar readiness de PostgreSQL
      description: Devuelve 200 cuando el backend puede comunicarse con PostgreSQL y 503 si la dependencia principal no está
        lista.
      operationId: getReadiness
      responses:
        '200':
          description: Servicio listo
          content:
            text/plain:
              schema:
                type: string
                example: 'ready

                  '
        '503':
          description: PostgreSQL no está listo
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags:
      - Sistema
      security: []
      summary: Descargar la especificación OpenAPI
      description: Especificación pública de integración. No contiene credenciales ni endpoints administrativos.
      operationId: getOpenAPISpec
      responses:
        '200':
          description: Especificación OpenAPI 3.0.3
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/territories/status:
    get:
      tags:
      - División territorial
      summary: Estadísticas del catálogo territorial
      responses:
        '200':
          description: Estadísticas del catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritoryStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getTerritoryStatus
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
  /api/v1/territories/provinces:
    get:
      tags:
      - División territorial
      summary: Lista las 32 provincias
      responses:
        '200':
          description: Provincias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: listProvinces
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
      parameters:
      - in: query
        name: regionCode
        required: false
        schema:
          type: string
        description: Filtra por región.
      description: Devuelve el catálogo oficial de provincias. Use `regionCode` solo cuando necesite filtrar por región.
      x-codeSamples:
      - lang: cURL
        source: 'curl -H ''X-API-Key: geo_TU_API_KEY'' https://geo.ltd.do/api/v1/territories/provinces'
      - lang: JavaScript
        source: 'const r = await fetch(''https://geo.ltd.do/api/v1/territories/provinces'', { headers: { ''X-API-Key'': process.env.GEO_RD_MAP_API_KEY
          } });

          const data = await r.json();'
  /api/v1/territories/cities:
    get:
      tags:
      - División territorial
      summary: Lista municipios y distritos municipales como ciudades
      parameters:
      - $ref: '#/components/parameters/ProvinceCode'
        required: true
      responses:
        '200':
          description: Ciudades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: listCities
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
      description: Devuelve municipios y distritos municipales en un único selector denominado “ciudad”. El `cityId` es el
        identificador estable que debe conservar la aplicación consumidora.
  /api/v1/territories/cities/{cityId}/neighborhoods:
    get:
      tags:
      - División territorial
      summary: Lista barrios oficiales y personalizados aprobados de una ciudad
      parameters:
      - in: path
        name: cityId
        required: true
        schema:
          type: string
          example: '25:01:01'
      - in: query
        name: includeCustom
        required: false
        schema:
          type: boolean
          default: true
        description: Incluye barrios personalizados aprobados.
      responses:
        '200':
          description: Barrios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborhoodListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listCityNeighborhoods
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
      description: Devuelve barrios oficiales y, por defecto, barrios personalizados aprobados de la ciudad seleccionada.
  /api/v1/territories/provinces/{code}/enrichment:
    get:
      tags:
      - Datos geoespaciales
      summary: Métricas de Overture asociadas a una provincia del catálogo local
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          pattern: ^[0-9]{2}$
          example: '25'
      responses:
        '200':
          description: Enriquecimiento provincial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceEnrichmentResponse'
        '404':
          description: Provincia no encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getProvinceEnrichment
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
  /api/v1/territories/cities/{cityId}/enrichment:
    get:
      tags:
      - Datos geoespaciales
      summary: Métricas de Overture asociadas a una ciudad del catálogo local
      parameters:
      - in: path
        name: cityId
        required: true
        schema:
          type: string
          example: '25:01:01'
      responses:
        '200':
          description: Enriquecimiento de ciudad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityEnrichmentResponse'
        '404':
          description: Ciudad no encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getCityEnrichment
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
  /api/v1/territories/selectors:
    get:
      tags:
      - División territorial
      summary: Bundle progresivo Provincia-Ciudad-Barrio
      parameters:
      - $ref: '#/components/parameters/ProvinceCode'
      - $ref: '#/components/parameters/CityID'
      - in: query
        name: includeCustom
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Bundle progresivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectorBundleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getTerritorySelectors
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:read
      description: Endpoint recomendado para formularios progresivos. Sin parámetros devuelve provincias; con `provinceCode`
        incluye ciudades; con `cityId` incluye barrios.
      x-codeSamples:
      - lang: cURL
        source: 'curl -H ''X-API-Key: geo_TU_API_KEY'' ''https://geo.ltd.do/api/v1/territories/selectors?provinceCode=25&cityId=25%3A01%3A01'''
  /api/v1/territories/neighborhoods/custom/suggestions:
    post:
      tags:
      - Barrios personalizados
      summary: Sugiere un barrio faltante; queda pendiente de aprobación central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomNeighborhoodSuggestionRequest'
            examples:
              barrio:
                value:
                  name: Los Pinos
                  provinceCode: '25'
                  municipalityCode: '01'
                  districtCode: '01'
                  cityId: '25:01:01'
                  submittedRole: cliente
                  submittedName: Mi App
      responses:
        '202':
          description: Sugerencia registrada como pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomNeighborhoodResponse'
        '409':
          description: Duplicado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: suggestCustomNeighborhood
      security:
      - ApiKeyAuth: []
      x-required-scope: territories:write
      parameters:
      - $ref: '#/components/parameters/TenantID'
  /api/v1/geolocation/config:
    get:
      tags:
      - Geolocalización
      summary: Configuración pública recomendada para el buscador de consumidores
      responses:
        '200':
          description: Configuración del buscador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeolocationConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getGeolocationConfig
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
  /api/v1/geolocation/search:
    get:
      tags:
      - Geolocalización
      summary: Busca destinos mezclando Overture, Nominatim y Google Places según configuración
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 160
          example: farmacia Santiago
      - in: query
        name: lat
        required: false
        schema:
          type: number
          format: double
        description: Sesgo opcional por cercanía.
      - in: query
        name: lng
        required: false
        schema:
          type: number
          format: double
        description: Sesgo opcional por cercanía.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 20
      responses:
        '200':
          description: Resultados unificados y deduplicados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: searchGeolocation
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
      description: Búsqueda unificada de destinos dentro de República Dominicana. GEO RD MAP mezcla el catálogo local, Overture,
        Nominatim y Google Places según configuración, normaliza resultados y evita que la aplicación consumidora tenga que
        integrar cada proveedor por separado.
      x-codeSamples:
      - lang: cURL
        source: 'curl -H ''X-API-Key: geo_TU_API_KEY'' ''https://geo.ltd.do/api/v1/geolocation/search?q=farmacia%20Santiago&limit=10'''
  /api/v1/geolocation/selections:
    post:
      tags:
      - Geolocalización
      summary: Confirma un resultado elegido y aprende localmente lugares de Google Places dentro de RD
      description: Confirma el resultado elegido por el usuario. Cuando el resultado proviene de Google Places y contiene
        `selectionToken`, GEO RD MAP valida la firma y puede aprender el lugar localmente para consultas futuras.
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSelectionRequest'
      responses:
        '200':
          description: Selección confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSelectionResponse'
        '400':
          description: Resultado inválido, no firmado o fuera de República Dominicana
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: confirmGeolocationSelection
      x-required-scope: geo:write
  /api/v1/geolocation/reverse:
    get:
      tags:
      - Geolocalización
      summary: Reverse geocoding híbrido con contexto territorial oficial
      parameters:
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      responses:
        '200':
          description: Resultado de reverse geocoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoReverseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: reverseGeocode
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
  /api/v1/geolocation/places/nearby:
    get:
      tags:
      - Geolocalización
      summary: POI Overture cercanos
      parameters:
      - in: query
        name: lat
        required: true
        schema:
          type: number
      - in: query
        name: lng
        required: true
        schema:
          type: number
      - in: query
        name: radius
        schema:
          type: number
          default: 1000
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listNearbyPlaces
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
  /api/v1/geolocation/addresses/nearby:
    get:
      tags:
      - Geolocalización
      summary: Direcciones Overture cercanas cuando existen en la release
      parameters:
      - in: query
        name: lat
        required: true
        schema:
          type: number
      - in: query
        name: lng
        required: true
        schema:
          type: number
      - in: query
        name: radius
        schema:
          type: number
          default: 250
      - in: query
        name: limit
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listNearbyAddresses
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
  /api/v1/map/config:
    get:
      tags:
      - Mapa
      summary: Configuración base para renderizar el mapa
      responses:
        '200':
          description: Configuración base del mapa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getMapConfig
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
  /api/v1/map/features:
    get:
      tags:
      - Mapa
      summary: FeatureCollection GeoJSON para un viewport
      parameters:
      - in: query
        name: bbox
        required: true
        schema:
          type: string
          example: -70.8,18.2,-69.5,19.0
      - in: query
        name: zoom
        schema:
          type: integer
          minimum: 0
          maximum: 22
          default: 12
      - in: query
        name: layers
        schema:
          type: string
          example: provinces,cities,neighborhoods,places,roads,buildings,geofences
      responses:
        '200':
          description: FeatureCollection para el viewport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapFeatureCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getMapFeatures
      security:
      - ApiKeyAuth: []
      x-required-scope: geo:read
  /api/v1/routing/status:
    get:
      tags:
      - Rutas
      summary: Estado del motor Valhalla
      responses:
        '200':
          description: Estado del motor de rutas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getRoutingStatus
      security:
      - ApiKeyAuth: []
      x-required-scope: routing:read
  /api/v1/routing/route:
    post:
      tags:
      - Rutas
      summary: Calcula una ruta
      responses:
        '200':
          description: Ruta calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: calculateRoute
      security:
      - ApiKeyAuth: []
      x-required-scope: routing:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            example:
              locations:
              - lat: 18.4861
                lon: -69.9312
              - lat: 18.4719
                lon: -69.8933
              costing: auto
              language: es-ES
      description: Calcula rutas sobre el grafo vial de República Dominicana. Para automóvil use `costing=auto`; la plataforma
        admite los perfiles habilitados por el motor de routing.
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST https://geo.ltd.do/api/v1/routing/route \\\n  -H 'Content-Type: application/json' \\\n  -H 'X-API-Key:\
          \ geo_TU_API_KEY' \\\n  -d '{\"locations\":[{\"lat\":18.4861,\"lon\":-69.9312},{\"lat\":18.4719,\"lon\":-69.8933}],\"\
          costing\":\"auto\",\"language\":\"es-ES\"}'"
  /api/v1/routing/matrix:
    post:
      tags:
      - Rutas
      summary: Calcula matriz de tiempos/distancias
      responses:
        '200':
          description: Matriz calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: calculateMatrix
      security:
      - ApiKeyAuth: []
      x-required-scope: routing:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixRequest'
  /api/v1/routing/map-match:
    post:
      tags:
      - Rutas
      summary: Ajusta trazas GPS a la red vial
      responses:
        '200':
          description: Traza ajustada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: mapMatch
      security:
      - ApiKeyAuth: []
      x-required-scope: routing:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapMatchRequest'
  /api/v1/routing/isochrone:
    post:
      tags:
      - Rutas
      summary: Calcula isócronas
      responses:
        '200':
          description: Isócrona calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: calculateIsochrone
      security:
      - ApiKeyAuth: []
      x-required-scope: routing:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsochroneRequest'
  /api/v1/routing/optimized-route:
    post:
      tags:
      - Rutas
      summary: Optimiza una ruta con múltiples paradas
      responses:
        '200':
          description: Ruta optimizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: calculateOptimizedRoute
      security:
      - ApiKeyAuth: []
      x-required-scope: routing:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizedRouteRequest'
