tags:
- name: Sistema
  description: Liveness, readiness y descarga de la especificación OpenAPI.
- name: División territorial
  description: Regiones, provincias, ciudades y barrios de República Dominicana.
- name: Barrios personalizados
  description: Sugerencias de barrios faltantes para revisión y aprobación central.
- name: Geolocalización
  description: Búsqueda, autocomplete, reverse geocoding, lugares, direcciones, vías y edificaciones.
- name: Mapa
  description: Configuración del mapa, GeoJSON y teselas vectoriales MVT.
- name: Geocercas
  description: Consulta de zonas de servicio y detección de pertenencia por coordenadas.
- name: Rutas
  description: Routing, matrices, map matching, isócronas y optimización de paradas.
- name: Navegación
  description: Sesiones de navegación con ubicación, ETA y recálculo.
- name: Datos geoespaciales
  description: Datos Overture normalizados y enriquecimiento territorial de República Dominicana.
x-integration-guide:
  admin_path: /admin/api-clients
  openapi_path: /openapi.yaml
  recommended_client: backend
  api_key_header: X-API-Key
  country_code: DO
  coordinate_reference_system: WGS 84 / EPSG:4326
  city_id_example: '25:01:01'
  scopes:
  - territories:read
  - territories:write
  - geo:read
  - geo:write
  - routing:read
  recommended_flow:
  - Crear una integración en el panel administrativo.
  - Asignar únicamente los scopes necesarios.
  - Generar una API Key y guardarla solo en el backend consumidor.
  - Usar provinceCode, cityId y GeoID como identificadores estables.
  - No conectar aplicaciones consumidoras directamente a Overture, Nominatim, Google Places ni Valhalla.
