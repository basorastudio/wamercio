name: WAMERCIO CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  api:
    name: Go API production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go mod tidy && go mod verify
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux go build -mod=readonly -trimpath -ldflags="-s -w" -o /tmp/wamercio-api ./cmd/api

  whatsapp:
    name: WhatsApp bridge production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go mod tidy && go mod verify
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux go build -mod=readonly -trimpath -ldflags="-s -w" -o /tmp/wamercio-whatsapp ./cmd/bridge

  domain-router:
    name: Domain router production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/domain-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go mod tidy && go mod verify
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux go build -mod=readonly -trimpath -ldflags="-s -w" -o /tmp/domain-router ./cmd/router

  docker:
    name: Docker compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config >/dev/null
