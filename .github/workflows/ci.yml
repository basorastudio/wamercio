name: WAMERCIO CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build

  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.mod
      - run: go mod download
      - run: go test ./...
      - run: go build ./...

  whatsapp:
    name: WhatsApp bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/whatsapp-bridge/go.mod
      - run: go mod download
      - run: go test ./...
      - run: go build ./...

  docker:
    name: Docker compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config >/dev/null
