name: Backend quality

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Check known vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          work-dir: backend
          go-version-input: "1.26.x"
          go-package: ./...
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check removed provider references
        working-directory: .
        shell: bash
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude='*.zip' \
            'wuzapi|wuz api' \
            backend frontend docs README.md .env.example docker-compose.yml; then
            echo "Legacy WhatsApp provider references were found. Use WAXUM exclusively." >&2
            exit 1
          fi
      - name: Check migration pairs
        shell: bash
        run: |
          shopt -s nullglob
          for directory in db/core_migrations db/global_customer_migrations db/tenant_migrations; do
            up_files=("$directory"/*.up.sql)
            down_files=("$directory"/*.down.sql)
            test "${#up_files[@]}" -gt 0
            test "${#up_files[@]}" -eq "${#down_files[@]}"
            for up_file in "${up_files[@]}"; do
              test -f "${up_file%.up.sql}.down.sql"
            done
          done
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Critical-path benchmarks
        run: go test -run '^$' -bench . -benchmem ./internal/httpapi
      - name: Production build
        run: go build -trimpath -buildvcs=true -pgo=auto ./cmd/api
