name: Production source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', '.next', 'node_modules'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Validate migration pairs
        run: |
          for directory in backend/db/core_migrations backend/db/global_customer_migrations backend/db/tenant_migrations; do
            for file in "$directory"/*.up.sql; do
              test -f "${file%.up.sql}.down.sql"
            done
          done
      - name: Validate frontend production surface
        working-directory: frontend
        run: node scripts/verify-production-surface.mjs
